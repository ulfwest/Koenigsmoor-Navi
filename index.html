<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Königsmoor Wegweiser</title>
<meta name="description" content="Wege, Parzellen, Routen und Notrufnummern für den Campingplatz Königsmoor">
<meta name="theme-color" content="#1f6fe0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Königsmoor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f4f4f1; --panel:#ffffff; --text:#1f2421; --muted:#6b726d; --line:#dfe2dd;
  --accent:#e8772e; --route:#1f6fe0; --start:#2e9d4b; --goal:#d93b2b; --chip:#f0f1ee;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151816; --panel:#1f2321; --text:#ecefec; --muted:#9aa29c; --line:#323833;
    --chip:#2a2f2c;
  }
}
:root[data-theme="dark"]{
  --bg:#151816; --panel:#1f2321; --text:#ecefec; --muted:#9aa29c; --line:#323833; --chip:#2a2f2c;
}
*{box-sizing:border-box}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%;margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#map{position:absolute;inset:0;touch-action:none;cursor:grab;background:#fff}
#map.drag{cursor:grabbing}
svg{width:100%;height:100%;display:block}
.way{fill:none;stroke:transparent;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}
.brand{fill:none;stroke:#d93b2b;stroke-width:3;animation:blink 1s ease-in-out infinite}
.ov text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;pointer-events:none}
.ov .pn{font-size:4.4px;font-weight:600;fill:#fff}
.ov .wl{font-size:5px;font-weight:600;fill:#f4f4f4;letter-spacing:.1px}
.way.sel{stroke:var(--accent);stroke-opacity:.95;stroke-width:8}
@keyframes blink{50%{stroke-opacity:.25}}
.route{fill:none;stroke:var(--route);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1 9;opacity:.95}
.foot{fill:var(--route);stroke:#fff;stroke-width:.5;opacity:0;animation:step .3s ease-out forwards}
@keyframes step{to{opacity:1}}
.route-bg{fill:none;stroke:#fff;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.route-line{fill:none;stroke:var(--route);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
#top{position:absolute;left:12px;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:5;max-width:520px}
.field{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:14px;
  padding:0 12px;box-shadow:0 2px 10px rgba(0,0,0,.15);height:48px}
.field input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:16px;min-width:0;width:100%;text-overflow:ellipsis}
.btn{border:0;background:var(--panel);color:var(--text);border-radius:14px;height:48px;min-width:48px;
  font-size:18px;box-shadow:0 2px 10px rgba(0,0,0,.15);cursor:pointer}
.btn.primary{background:var(--route);color:#fff}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:4px}

/* bottom sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--panel);
  border-radius:18px 18px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.18);max-height:46vh;display:flex;flex-direction:column;
  max-width:520px;margin:0 auto;transition:max-height .25s}
#sheet.compact{max-height:175px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 4px;flex:none;cursor:pointer}
#sheetBody{overflow-y:auto;padding:4px 16px 16px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 8px}
.list{list-style:none;margin:0;padding:0}
.list li{min-width:0;overflow-wrap:anywhere;display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list li:last-child{border-bottom:0}
.list li:hover{background:var(--chip)}
.list .k{font-size:12px;color:var(--muted);margin-left:6px}
.list .m{color:var(--muted);font-size:14px;white-space:nowrap}
h2{margin:6px 0 2px;font-size:20px}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{border:0;border-radius:12px;padding:12px 14px;font-size:15px;cursor:pointer;background:var(--chip);color:var(--text)}
.pill.primary{background:var(--route);color:#fff}
.big{font-size:28px;font-weight:700}
.sub{color:var(--muted);font-size:14px}
.steps-line{font-size:14px;line-height:1.4;margin-top:4px}
.steps{margin:10px 0 0;padding-left:20px;font-size:15px;line-height:1.6}

/* Reiter */
.tabs{display:flex;background:var(--panel);border-radius:14px;padding:4px;gap:4px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.tab{flex:1;border:0;background:transparent;color:var(--text);font-size:15px;padding:9px 4px;border-radius:10px;cursor:pointer}
.ri{width:1.35em;height:1.35em;vertical-align:-0.3em;flex:none}
.tab .ri{width:1.5em;height:1.5em}
.pill{display:inline-flex;align-items:center;gap:.35em;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:30%;transform:translateX(-50%);z-index:20;background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px}
.tab.on{background:var(--route);color:#fff;font-weight:600}

/* route form */
#routeForm{display:none;min-width:0}
.rf{display:flex;gap:8px;align-items:center}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
#routeForm .field{height:44px}
#swapBtn{height:94px;min-width:44px}
.info-sec{margin:12px 0 4px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tel{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none}
.tel b{color:var(--route);font-size:17px}
.tel.sos b{color:var(--goal)}
.ico{display:inline-block;width:22px}
.legend{display:inline-block;width:14px;height:14px;background:#d93b2b;border-radius:3px;vertical-align:-2px;margin-right:6px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.s{background:var(--start)} .dot.g{background:var(--goal);border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
#sugg{position:absolute;left:12px;right:12px;top:118px;z-index:7;max-width:520px;background:var(--panel);
  border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.2);max-height:40vh;overflow:auto;display:none;padding:0 12px}
#zoom{position:absolute;right:12px;bottom:calc(46vh + 12px);z-index:5;display:flex;flex-direction:column;gap:6px}
#sheet.compact ~ #zoom{bottom:187px}
/* Bedienelemente bei stark vergrößerter Browser-Anzeige verkleinern (siehe fitUI) */
#top,#sheet,#zoom,#sugg{zoom:var(--ui,1)}
#zoom .btn{height:42px;min-width:42px}

/* Handy: alles kompakter, damit mehr Plan sichtbar bleibt */
@media (max-width:600px){
  /* Navileiste: Reiter als kleine Symbole, Suchfeld in derselben Zeile */
  #top{left:6px;right:6px;top:6px;gap:4px;flex-direction:row;flex-wrap:wrap;align-items:center}
  .tabs{flex:none;border-radius:10px;padding:2px;gap:1px;height:34px}
  .tab{width:32px;flex:none;font-size:14px;padding:0;border-radius:8px;line-height:30px}
  .tab .lbl{display:none}
  .field{height:34px;border-radius:10px;padding:0 8px;gap:6px}
  #searchField{flex:1;min-width:0}
  .x{font-size:15px;padding:2px}
  #routeForm{flex:1 1 100%}
  #routeForm .field{height:30px;flex:none;padding:0 8px}
  #routeForm .field input{font-size:16px} /* 16px verhindert das Auto-Zoomen auf dem iPhone */
  .dot{width:9px;height:9px}
  .steps-line{font-size:12px;margin-top:2px}
  .col{gap:3px}
  #swapBtn{height:63px;min-width:32px;font-size:14px;border-radius:10px}
  #sheet{max-height:34vh;border-radius:14px 14px 0 0}
  #sheet.compact{max-height:118px}
  .grab{margin:6px auto 2px}
  #sheetBody{padding:2px 12px 10px}
  .hint{font-size:12px;margin:2px 0 4px}
  .list li,.tel{padding:7px 2px;font-size:14px}
  .list .m{font-size:12px}
  .list .k{font-size:11px}
  .info-sec{margin:8px 0 2px;font-size:11px}
  .tel b{font-size:15px}
  h2{font-size:16px;margin:2px 0 0}
  .sub{font-size:12px}
  .big{font-size:20px}
  .steps{margin-top:4px;font-size:13px;line-height:1.45}
  .row{margin-top:6px;gap:6px}
  .pill{padding:7px 11px;font-size:13px;border-radius:10px}
  #zoom{right:8px;bottom:calc(34vh + 8px);gap:4px}
  #sheet.compact ~ #zoom{bottom:126px}
  #zoom .btn{height:34px;min-width:34px;font-size:15px;border-radius:10px}
  #sugg{left:8px;right:8px;padding:0 10px}
}
</style>
</head>

function project(p){ // nächster Punkt auf dem Wegenetz
  let best=null;
  for(const s of segs){const A=nodes[s.a],B=nodes[s.b];const dx=B[0]-A[0],dy=B[1]-A[1];
    const L=dx*dx+dy*dy;let t=L?((p[0]-A[0])*dx+(p[1]-A[1])*dy)/L:0;t=Math.max(0,Math.min(1,t));
    const q=[A[0]+t*dx,A[1]+t*dy];const d=dist(p,q);if(!best||d<best.d)best={d,q,s,t};}

function shortest(pA,pB){

  const pos=i=>i===S?A.q:i===T?B.q:nodes[i];
  for(const [X,id] of [[A,S],[B,T]]){
    push(id,X.s.a,dist(X.q,nodes[X.s.a]),X.s.name);push(X.s.a,id,dist(X.q,nodes[X.s.a]),X.s.name);
    push(id,X.s.b,dist(X.q,nodes[X.s.b]),X.s.name);push(X.s.b,id,dist(X.q,nodes[X.s.b]),X.s.name);
  }
  if(A.s===B.s){push(S,T,dist(A.q,B.q),A.s.name);}
  const D=new Array(N+2).fill(Infinity),prev=new Array(N+2).fill(-1),pn=new Array(N+2);
  const done=new Array(N+2).fill(false);D[S]=0;
  for(;;){let u=-1,m=Infinity;for(let i=0;i<N+2;i++)if(!done[i]&&D[i]<m){m=D[i];u=i;}
    if(u<0||u===T)break;done[u]=true;
    const edges=(u<N?adj[u]:[]).concat(extra.get(u)||[]);
    for(const [v,w,name] of edges){if(D[u]+w<D[v]){D[v]=D[u]+w;prev[v]=u;pn[v]=name;}}}
  if(D[T]===Infinity)return null;
  const path=[],names=[];for(let v=T;v!==-1;v=prev[v]){path.unshift(pos(v));if(prev[v]!==-1)names.unshift({n:pn[v],w:dist(pos(prev[v]),pos(v))});}
  // Abschnitte zusammenfassen
  const steps=[];for(const s of names){const n=s.n||'Verbindungsweg';const l=steps[steps.length-1];
    if(l&&l.n===n)l.w+=s.w;else steps.push({n,w:s.w});}
  return {path:[pA,...path,pB],len:D[T]+A.d+B.d,steps:steps.filter(s=>s.w>2)};
}

function boxVB(b,pad=40){const ar=svg.clientWidth/svg.clientHeight||1.4;
  const sheetH=$('sheet').getBoundingClientRect().height, topH=$('top').getBoundingClientRect().bottom;
  const visH=svg.clientHeight-sheetH-topH; const fracTop=topH/svg.clientHeight, fracVis=Math.max(.25,visH/svg.clientHeight);
  let w=Math.max(b[2]-b[0]+pad*2,120),h=Math.max(b[3]-b[1]+pad*2,90);
  if(w/(h/fracVis)>ar)h=w/ar*fracVis;else w=h/fracVis*ar;

let lastTap=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTap<300&&!e.target.closest('input,button,a,li'))e.preventDefault();lastTap=n;},{passive:false});
// Ist die Seite im Browser stark vergrößert (z. B. Android „Standardzoom“/große Schrift), wird sie sehr schmal.
// Dann die Bedienelemente so verkleinern, als wäre der Bildschirm 360 px breit; der Plan bleibt unberührt.
let UI=1;function fitUI(){UI=Math.min(1,innerWidth/360);document.documentElement.style.setProperty('--ui',UI);}
fitUI();addEventListener('resize',fitUI);
$('zin').onclick=()=>zoomAt(1/1.4);$('zout').onclick=()=>zoomAt(1.4);$('zall').onclick=()=>animTo(fitAllVB());

// ---------- Oberfläche ----------
const sheet=$('sheet'),body=$('sheetBody');
new MutationObserver(()=>body.scrollTop=0).observe(body,{childList:true});
let mode='search',current=null,routeFrom=null,routeTo=null;
$('grab').onclick=()=>sheet.classList.toggle('compact');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

const START=()=>TARGETS.find(t=>t.start);
const fromStart=new Map();
function distStart(t){ // ungefähre Gehstrecke vom Eingang
  if(t.start)return 0;if(t.brand)return null;if(fromStart.has(t))return fromStart.get(t);
  const s=START(),r=shortest(anchor(s,t),anchor(t,s));const m=r?meters(r.len):null;fromStart.set(t,m);return m;}
const ca=m=>m==null?'':m===0?'hier':'ca. '+fmtM(Math.max(10,m));
function item(t){const d=distStart(t);
  return `<li data-i="${TARGETS.indexOf(t)}"><span>${t.icon?`<span class="ico">${t.icon}</span>`:''}${esc(t.name)}${t.type==='Weg'?`<span class="k">${fmtM(t.len)} lang</span>`:''}</span><span class="m">${ca(d)}</span></li>`;}
function renderList(q){
  clearHl();gR.innerHTML='';gM.innerHTML='';sheet.classList.remove('compact');
  const res=find(q);
  const ways=res.filter(t=>t.type==='Weg'),orte=res.filter(t=>t.type==='Ort'),parz=res.filter(t=>t.type==='Parzelle');
  body.innerHTML=`<div class="hint">${q.trim()?res.length+' Treffer':'Alle '+ways.length+' Wege und '+orte.length+' Orte · Parzelle: Nummer eintippen'} · Entfernung ungefähr ab Eingang</div>`+
    (ways.length?`<div class="info-sec">Wege</div><ul class="list">${ways.map(item).join('')}</ul>`:'')+
    (orte.length?`<div class="info-sec">Gebäude, Teiche &amp; Plätze</div><ul class="list">${orte.map(item).join('')}</ul>`:'')+
    (parz.length?`<div class="info-sec">Parzellen</div><ul class="list">${parz.map(item).join('')}</ul>`:'')+
    (res.length?'':`<div class="hint">Nichts gefunden. Versuch es mit einem Teil des Namens, z. B. „gin“, „teich“ oder einer Parzellennummer wie „Rosenweg 12“.</div>`);
  body.querySelectorAll('li').forEach(li=>li.onclick=()=>showTarget(TARGETS[+li.dataset.i]));
  if(q.trim()&&res.length===1)showTarget(res[0],true);
}
function showWay(n){showTarget(TARGETS.find(t=>t.name===n));}
function showTarget(t,keepTyping){
  if(mode==='route'){return;}
  if(mode!=='search')setMode('search');
  current=t;clearHl();gR.innerHTML='';gM.innerHTML='';
  if(!keepTyping)$('q').value=t.name;
  if(t.type==='Weg'){wayEls[t.name].classList.add('sel');}else if(t.brand)markBrand();else markGoal(t.p);
  sheet.classList.add('compact');
  const d=distStart(t);
  const facts=t.type==='Weg'?`Länge ca. ${fmtM(t.len)} · ${d?ca(d)+' vom Eingang':'am Eingang'}`
    :t.brand?`${BRAND.length} Flächen – im Plan rot umkreist`:(t.start?'Hier geht es los.':`${ca(d)} vom Eingang · ca. ${minutes(d)} Min. zu Fuß`);
  body.innerHTML=`<h2>${t.icon||''} ${esc(t.name)}</h2><div class="sub">${facts}</div>${t.info?`<div style="margin-top:6px">${esc(t.info)}</div>`:''}
   <div class="row">${t.start||t.brand?'':'<button class="pill primary" id="goHere"><svg class="ri" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="19" r="2.6" fill="currentColor"/><path d="M6 16.4V14a3.5 3.5 0 0 1 3.5-3.5h5A3.5 3.5 0 0 0 18 7V5.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 3.8"/><path d="M18 1.5c-2.2 0-3.6 1.6-3.6 3.5 0 2.5 3.6 6 3.6 6s3.6-3.5 3.6-6c0-1.9-1.4-3.5-3.6-3.5zm0 4.8a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6z" fill="currentColor"/></svg> Route hierher</button>'}<button class="pill" id="shareT" title="Teilen"><svg class="ri" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3" fill="currentColor"/><circle cx="6" cy="12" r="3" fill="currentColor"/><circle cx="18" cy="19" r="3" fill="currentColor"/><path d="M8.6 10.7l6.8-4M8.6 13.3l6.8 4" stroke="currentColor" stroke-width="2"/></svg> Teilen</button><button class="pill" id="back">Alle anzeigen</button></div>`;
  if($('goHere'))$('goHere').onclick=()=>{startRoute(START(),t);};
  $('back').onclick=()=>{$('q').value='';renderList('');animTo(fitAllVB());};
  $('shareT').onclick=()=>share(t);
  const fit=()=>{if(t.brand)fitBox(bbox(BRAND),15);else if(t.type==='Weg')fitBox(bbox(t.pts),35);else fitBox([t.p[0]-50,t.p[1]-40,t.p[0]+50,t.p[1]+40],10);};
  fit();setTimeout(fit,260);
}
$('q').addEventListener('input',e=>renderList(e.target.value));
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){const r=find(e.target.value);if(r.length)showTarget(r[0]);e.target.blur();}});
$('qx').onclick=()=>{$('q').value='';renderList('');animTo(fitAllVB());$('q').focus();};

// Reiter
function setMode(m){mode=m;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('searchField').style.display=m==='search'?'flex':'none';
  $('routeForm').style.display=m==='route'?'block':'none';
  $('sugg').style.display='none';}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{const m=b.dataset.m;if(m===mode)return;
  if(m==='search'){setMode('search');$('q').value=current?current.name:'';current?showTarget(current):renderList('');}
  else if(m==='route')startRoute(routeFrom||START(),routeTo||current);
  else showInfo();});
function showInfo(){setMode('info');clearHl();gR.innerHTML='';gM.innerHTML='';sheet.classList.remove('compact');
  for(const o of PLACES){const t=document.createElementNS(NS,'text');t.setAttribute('x',o.p[0]);t.setAttribute('y',o.p[1]+4);
    t.setAttribute('text-anchor','middle');t.setAttribute('font-size','11');t.textContent=o.icon;gM.appendChild(t);}
  body.innerHTML=`<button class="pill primary" id="shareApp" style="margin-top:6px"><svg class="ri" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3" fill="currentColor"/><circle cx="6" cy="12" r="3" fill="currentColor"/><circle cx="18" cy="19" r="3" fill="currentColor"/><path d="M8.6 10.7l6.8-4M8.6 13.3l6.8 4" stroke="currentColor" stroke-width="2"/></svg> App teilen</button>
    <div class="info-sec">Wichtige Rufnummern</div>
    ${PHONES.map(p=>`<a class="tel${p.sos?' sos':''}" href="tel:${p.nr.replace(/\s/g,'')}"><span>${esc(p.label)}</span><b>📞 ${esc(p.nr)}</b></a>`).join('')}
    <div class="info-sec">Brandschutz</div>
    <ul class="list"><li id="brandLi"><span><span class="legend"></span>Alle roten Parzellen sind Brandschutzflächen – freihalten!</span><span class="m">${BRAND.length} ›</span></li></ul>
    <div class="info-sec">Gebäude, Teiche &amp; Plätze</div><ul class="list">${PLACES.map(o=>item(TARGETS.find(t=>t.name===o.name))).join('')}</ul>
    <div class="info-sec">Anschrift</div><div class="sub" style="line-height:1.6">Erholungszentrum Königsmoor<br>Markfelder Weg 79, 45731 Waltrop<br>
    <a href="mailto:info@erholungszentrum-koenigsmoor.de">info@erholungszentrum-koenigsmoor.de</a></div>
    <div class="hint" style="margin-top:12px">Alle Entfernungen ungefähr, ab Eingang, geschätzt aus dem Lageplan.</div>`;
  body.querySelectorAll('li[data-i]').forEach(li=>li.onclick=()=>showTarget(TARGETS[+li.dataset.i]));
  $('brandLi').onclick=()=>showTarget(TARGETS.find(t=>t.brand));
  animTo(fitAllVB());}
function markBrand(){for(const p of BRAND)gM.appendChild(el('circle',{cx:p[0],cy:p[1],r:10,class:'brand'}));}
function startRoute(from,to){setMode('route');if(to&&(to.start||to.brand))to=null;routeFrom=asTarget(from);routeTo=to?asTarget(to):null;
  $('from').value=routeFrom?routeFrom.name:'';$('to').value=routeTo?routeTo.name:'';
  if(!routeTo){$('to').focus();showSugg($('to'));}calcRoute();}
function asTarget(x){return x&&(x.type?x:TARGETS.find(t=>t.name===x.name));}
$('swapBtn').onclick=()=>{[routeFrom,routeTo]=[routeTo,routeFrom];$('from').value=routeFrom?routeFrom.name:'';$('to').value=routeTo?routeTo.name:'';calcRoute();};
let suggFor=null;
function showSugg(inp){suggFor=inp;const r=find(inp.value).concat(inp.value.trim()?[]:PLACES.map(asTarget));
  const uniq=[...new Set(r)];const s=$('sugg');s.style.top=(($('top').getBoundingClientRect().bottom+6)/UI)+'px';
  s.innerHTML=`<ul class="list">${uniq.map(t=>`<li data-i="${TARGETS.indexOf(t)}"><span>${esc(t.name)}<span class="k">${t.type}</span></span></li>`).join('')}</ul>`;
  s.style.display=uniq.length?'block':'none';
  s.querySelectorAll('li').forEach(li=>li.onpointerdown=ev=>{ev.preventDefault();const t=TARGETS[+li.dataset.i];
    if(inp.id==='from')routeFrom=t;else routeTo=t;inp.value=t.name;s.style.display='none';inp.blur();
    if(inp.id==='from'&&!routeTo){$('to').focus();showSugg($('to'));}calcRoute();});}
for(const inp of [$('from'),$('to')]){inp.addEventListener('focus',()=>{inp.select();showSugg(inp);});
  inp.addEventListener('input',()=>showSugg(inp));inp.addEventListener('blur',()=>setTimeout(()=>{if(suggFor===inp)$('sugg').style.display='none';},150));
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const r=find(inp.value);if(r.length){if(inp.id==='from')routeFrom=r[0];else routeTo=r[0];inp.value=r[0].name;$('sugg').style.display='none';inp.blur();calcRoute();}}});}
function anchor(t,other){ // Punkt für Wegziele: nächster Punkt des Weges zum anderen Ende
  if(t.type!=='Weg')return t.p;if(!other)return midpoint(t.pts);const o=other.type==='Weg'?midpoint(other.pts):other.p;
  let best=null;for(let i=1;i<t.pts.length;i++){const A=t.pts[i-1],B=t.pts[i];const dx=B[0]-A[0],dy=B[1]-A[1],L=dx*dx+dy*dy;
    let k=((o[0]-A[0])*dx+(o[1]-A[1])*dy)/L;k=Math.max(0,Math.min(1,k));const q=[A[0]+k*dx,A[1]+k*dy];const d=dist(o,q);if(!best||d<best.d)best={d,q};}
  // Für einen Weg als Ziel: zum Anfang des Weges (Einmündung) statt zur Mitte führen
  return best.q;}
// Route als Fußspuren: abwechselnd linker und rechter Fuß entlang des Weges
const FOOT='M0,-2.6 C1.1,-2.6 1.4,-1.2 1.2,0 C1,1.1 0.7,1.6 0,1.6 C-0.7,1.6 -1,1.1 -1.2,0 C-1.4,-1.2 -1.1,-2.6 0,-2.6Z'
  +'M0,2.1 C0.8,2.1 0.9,2.6 0.8,3 C0.6,3.4 -0.6,3.4 -0.8,3 C-0.9,2.6 -0.8,2.1 0,2.1Z';
function drawFootsteps(path){
  const STEP=6.5,SIDE=1.6,total=plen(path),gap=Math.min(0.06,1.5/(total/STEP));let i=1,base=0,n=0; // ganze Spur in höchstens 1,5 s
  for(let d=STEP/2;d<total;d+=STEP,n++){
    while(i<path.length-1&&base+dist(path[i-1],path[i])<d){base+=dist(path[i-1],path[i]);i++;}
    const A=path[i-1],B=path[i],L=dist(A,B)||1,t=(d-base)/L,ux=(B[0]-A[0])/L,uy=(B[1]-A[1])/L;
    const side=n%2?SIDE:-SIDE,x=A[0]+ux*L*t-uy*side,y=A[1]+uy*L*t+ux*side,ang=Math.atan2(uy,ux)*180/Math.PI-90; // Zehen in Gehrichtung
    const f=el('path',{d:FOOT,class:'foot',transform:`translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${ang.toFixed(1)}) scale(${n%2?-1:1} -1)`});
    f.style.animationDelay=(n*gap).toFixed(3)+'s';gR.appendChild(f);}
}
function calcRoute(){clearHl();gR.innerHTML='';gM.innerHTML='';sheet.classList.remove('compact');
  if(!routeFrom||!routeTo){body.innerHTML=`<div class="hint">Start (grün) und Ziel (rot) wählen. Tipp: ⇅ tauscht beide.</div>`;
    if(routeFrom){const p=anchor(routeFrom);markStart(p);}return;}
  const pA=anchor(routeFrom,routeTo),pB=anchor(routeTo,routeFrom);
  if(routeTo.type==='Weg')wayEls[routeTo.name].classList.add('sel');
  const r=shortest(pA,pB);
  if(!r){body.innerHTML='<div class="hint">Keine Verbindung gefunden.</div>';return;}
  drawFootsteps(r.path);
  markStart(pA);markGoal(pB);
  const m=meters(r.len);
  // knappe Zusammenfassung: Meter + Minuten, darunter die Wege in einer Zeile
  body.innerHTML=`<div><span class="big">ca. ${fmtM(m)}</span> <span class="sub">· ca. ${minutes(m)} Min. zu Fuß</span></div>
    <div class="steps-line">${r.steps.map(s=>`${esc(s.n)} <span class="sub">${fmtM(Math.max(10,meters(s.w)))}</span>`).join(' → ')}</div>`;
  sheet.classList.add('compact');
  setTimeout(()=>fitBox(bbox(r.path),45),30);
}

// Teilen: App-Link bzw. Link direkt zu einem Ziel (?ziel=Name); ohne Teilen-Menü wird der Link kopiert
const APP_URL=location.origin+location.pathname;
async function share(t){
  const url=t?APP_URL+'?ziel='+encodeURIComponent(t.name):APP_URL;
  const text=t?`Königsmoor: ${t.name}`:'Königsmoor Wegweiser – Wege, Parzellen, Route und Notrufnummern';
  try{if(navigator.share){await navigator.share({title:'Königsmoor Wegweiser',text,url});return;}}catch(e){if(e.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(text+' '+url);toast('Link kopiert');}catch(e){prompt('Link zum Teilen:',url);}
}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2000);}
document.addEventListener('click',e=>{if(e.target.closest('#shareApp'))share(null);});

renderList('');
requestAnimationFrame(()=>setVB(fitAllVB()));
// Direktlink: ?ziel=Parzelle 12 · Rosenweg öffnet das Ziel gleich
{const z=new URLSearchParams(location.search).get('ziel'),t=z&&TARGETS.find(x=>x.name===z);if(t)setTimeout(()=>showTarget(t),300);}
window.addEventListener('resize',()=>setVB(vb));

// Als App installierbar und offline nutzbar (siehe sw.js)
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
